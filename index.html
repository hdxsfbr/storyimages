<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryImages Feed Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">StoryImages</p>
        <h1>Adaptive Image Story Feed</h1>
        <p class="subhead">
          Scroll to explore images. The feed learns which categories keep your attention and
          brings more of them toward the top.
        </p>
      </div>
      <div class="legend">
        <p class="legend-title">Live preference signal</p>
        <div id="preferenceBars" class="bars"></div>
      </div>
    </header>

    <main>
      <section class="feed" id="feed"></section>
    </main>

    <template id="cardTemplate">
      <article class="card">
        <div class="card-image">
          <img alt="" loading="lazy" />
        </div>
        <div class="card-meta">
          <span class="card-category"></span>
          <span class="card-title"></span>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
